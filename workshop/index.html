<!doctype html>
<html lang="en" data-phase="intro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Swiss AI Futures citizen workshop presentation">
    <meta name="theme-color" content="#f3efe6">
    <title>Swiss AI Futures Workshop</title>
    <link rel="icon" type="image/png" href="../assets/images/logos/favicon.png">
    <link rel="preload" href="../assets/fonts/BasisGrotesque-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/images/logos/logo-warm-long.png" as="image">
    <link rel="stylesheet" href="workshop.css?v=20260809-8">
  </head>
  <body>
    <div class="ambient-field" aria-hidden="true">
      <span class="ambient-shape ambient-shape-a"></span>
      <span class="ambient-shape ambient-shape-b"></span>
    </div>

    <main class="deck" id="deck" aria-live="polite">
      <header class="deck-header">
        <a class="deck-brand" href="../" aria-label="Swiss AI Futures home">
          <img src="../assets/images/logos/logo-warm-long.png" alt="Swiss AI Futures" width="252" height="50">
        </a>
        <div class="deck-context">
          <span id="phase-label">Welcome</span>
          <span id="session-label"></span>
          <div class="deck-tools">
            <div class="location-switcher" id="location-switcher" aria-label="Workshop location"></div>
            <a
              class="moderator-guide-link"
              id="moderator-guide-link"
              href="moderator-guide.html"
              target="_blank"
              rel="noopener"
              data-ui="moderatorGuide"
            >Moderator guide</a>
            <div class="language-switcher" id="language-switcher" aria-label="Presentation language"></div>
          </div>
        </div>
      </header>

      <div class="slide-viewport" id="slide-viewport">
        <div class="loading-state" id="loading-state">
          <span data-ui="preparing">Preparing workshop</span>
          <strong>Swiss AI Futures</strong>
        </div>
        <div class="slide-track" id="slide-track"></div>
        <button class="slide-hit-zone slide-hit-zone-previous" type="button" data-action="previous" aria-label="Previous slide"></button>
        <button class="slide-hit-zone slide-hit-zone-next" type="button" data-action="next" aria-label="Next slide"></button>
      </div>

      <div class="timer-display" id="timer-display" hidden aria-live="polite">
        <span id="timer-label" data-ui="timer">Timer</span>
        <strong id="timer-value">08:00</strong>
      </div>

      <footer class="deck-controls" id="deck-controls">
        <div class="progress-wrap" aria-label="Presentation progress">
          <span class="progress-track" aria-hidden="true"><span id="progress-fill"></span></span>
          <span class="slide-count"><b id="current-slide">01</b><span>/</span><span id="total-slides">18</span></span>
        </div>
        <nav class="control-actions" aria-label="Presentation controls">
          <button type="button" data-action="previous" data-ui="back" aria-label="Previous slide">Back</button>
          <button type="button" data-action="overview" data-ui="overview" aria-label="Open slide overview">Overview</button>
          <button type="button" data-action="notes" data-ui="notes" aria-label="Toggle presenter notes">Notes</button>
          <button type="button" data-action="fullscreen" data-ui="fullscreen" aria-label="Enter fullscreen">Full screen</button>
          <button class="control-next" type="button" data-action="next" data-ui="next" aria-label="Next slide">Next</button>
        </nav>
      </footer>
    </main>

    <aside class="presenter-panel" id="presenter-panel" aria-label="Presenter notes" aria-hidden="true">
      <div class="presenter-heading">
        <div>
          <span data-ui="presenterView">Presenter view</span>
          <strong id="presenter-title" data-ui="slideNotes">Slide notes</strong>
        </div>
        <button type="button" data-action="notes" data-ui="close" aria-label="Close presenter notes">Close</button>
      </div>
      <div class="presenter-scroll">
        <section class="presenter-timing">
          <span data-ui="timing">Timing</span>
          <strong id="presenter-timing">—</strong>
        </section>
        <section class="presenter-notes" id="presenter-notes"></section>
      </div>
    </aside>

    <section class="overview" id="overview" role="dialog" aria-modal="true" aria-label="Slide overview" aria-hidden="true">
      <div class="overview-header">
        <div>
          <span data-ui="workshopOverview">Workshop overview</span>
          <strong data-ui="chooseSlide">Choose a slide</strong>
        </div>
        <button type="button" data-action="overview" data-ui="close">Close</button>
      </div>
      <div class="overview-grid" id="overview-grid"></div>
    </section>

    <section class="help-panel" id="help-panel" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" aria-hidden="true">
      <div>
        <span data-ui="keyboardShortcuts">Keyboard shortcuts</span>
        <strong data-ui="shortcutLead">Run the room without looking down</strong>
      </div>
      <dl>
        <div><dt data-ui="nextPrevious">Next / previous</dt><dd data-ui="nextPreviousKeys">→ ← or Space</dd></div>
        <div><dt data-ui="overview">Overview</dt><dd>O</dd></div>
        <div><dt data-ui="presenterNotes">Presenter notes</dt><dd>N</dd></div>
        <div><dt data-ui="timer">Timer</dt><dd>T</dd></div>
        <div><dt data-ui="fullscreen">Full screen</dt><dd>F</dd></div>
        <div><dt data-ui="blackScreen">Black screen</dt><dd>B</dd></div>
      </dl>
      <button type="button" data-action="help" data-ui="close">Close</button>
    </section>

    <button class="help-trigger" type="button" data-action="help" data-ui="help" aria-label="Show keyboard shortcuts">Help</button>
    <div class="black-screen" id="black-screen" hidden aria-hidden="true"></div>

    <noscript>
      <p class="noscript-message">This presentation needs JavaScript enabled.</p>
    </noscript>
    <script src="workshop.js?v=20260810-4" defer></script>
  </body>
</html>
